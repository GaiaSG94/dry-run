[package]
name = "dryrun-gate"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Garde-barrière et serveur HTTP pour le pare-feu Dry Run"

# Le vrai simulateur (`dryrun-sim`, section 4 du SPEC) est le chemin par défaut.
# La feature `stub` fournit un simulateur en mémoire qui respecte la même API,
# pour compiler et tester le crate seul, sans `near-sandbox` :
#   cargo build -p dryrun-gate --no-default-features --features stub
[features]
default = ["real-sim"]
stub = []
real-sim = ["dep:dryrun-sim"]

[dependencies]
dryrun-core = { path = "../dryrun-core" }
dryrun-sim = { path = "../dryrun-sim", optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
# Le mode testnet lit `status()` par RPC : `rustls-tls` évite la dépendance
# système OpenSSL, ce qui garde `cargo build` exécutable partout.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
base64 = { workspace = true }

[dev-dependencies]
# Le client HTTP des tests : `rustls-tls` évite la dépendance système OpenSSL,
# ce qui garde `cargo test` exécutable sur n'importe quelle machine locale.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[[bin]]
name = "dryrun-gate"
path = "src/main.rs"

[lib]
name = "dryrun_gate"
path = "src/lib.rs"