name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  lint-and-test:
    name: fmt + clippy + tests unitaires
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: dryrun-ci
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests unitaires (sans bac à sable)
        run: cargo test --workspace --lib --bins
      - name: Banc de test 200 robots (make sim)
        run: cargo run --release -p dryrun-gate -- sim 42
      - name: Build WASM des contrats
        run: cargo build --target wasm32-unknown-unknown --release -p vault -p good-dex -p test-token -p test-nft -p trap-drainer -p trap-skimmer -p trap-half-step -p trap-liar -p trap-approver -p trap-shapeshifter -p trap-two-face