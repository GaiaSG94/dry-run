[workspace]
resolver = "2"
members = ["crates/*", "contracts/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.86"
license = "MIT OR Apache-2.0"
repository = "https://github.com/GaiaSG94/dry-run"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
near-sdk = "5.30"
near-api = "0.8"
near-sandbox = "0.4"
near-primitives = "0.38"
near-crypto = "0.38"
near-token = "0.3"
reqwest = { version = "0.12", features = ["json"] }
borsh = "1"
base64 = "0.22"
ed25519-dalek = "2"
sha2 = "0.10"
hex = "0.4"
rand = "0.8"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
