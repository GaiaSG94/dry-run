<!doctype html>
<html lang="en" data-resolution="landscape"
  data-composition-variables='[{"id":"repo","type":"string","label":"Repository","default":"github.com/GaiaSG94/dry-run"},{"id":"question","type":"string","label":"Closing question","default":"What would you let your agent spend without asking?"}]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      :root {
        --ground: #000000;
        --ink: #f4f7f5;
        --mute: #8a9690;
        --mint: #3dffb0;
        --red: #ff5d6c;
        --font-display: "Inter", sans-serif;
        --font-mono: "JetBrains Mono", monospace;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--ground); }
      #root { position: relative; width: 100%; height: 100%; background: var(--ground); font-family: var(--font-display); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="45.5" data-width="1920" data-height="1080">
      <div id="hook" data-composition-id="hook" data-composition-src="compositions/hook.html" data-start="0" data-duration="4" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="tension" data-composition-id="tension" data-composition-src="compositions/tension.html" data-start="4" data-duration="4.6" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="reveal" data-composition-id="reveal" data-composition-src="compositions/reveal.html" data-start="8.6" data-duration="6.4" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="proof" data-composition-id="proof" data-composition-src="compositions/proof.html" data-start="15" data-duration="9" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="payoff" data-composition-id="payoff" data-composition-src="compositions/payoff.html" data-start="24" data-duration="3" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="near" data-composition-id="near" data-composition-src="compositions/near.html" data-start="27" data-duration="11" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="endcard" data-composition-id="endcard" data-composition-src="compositions/endcard.html" data-start="38" data-duration="7.5" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="captions" data-composition-id="captions" data-composition-src="compositions/captions.html" data-start="0" data-duration="38" data-track-index="2" data-track-kind="captions" data-width="1920" data-height="1080" style="z-index: 10"></div>

      <audio id="narration" class="clip" src="assets/narration.wav" data-start="0" data-duration="45.5" data-track-index="3" data-volume="1"></audio>
      <audio id="bed" class="clip" src="assets/bed.wav" data-start="4" data-duration="17.13" data-track-index="4" data-volume="0.16"></audio>
      <audio id="hit" class="clip" src="assets/hit.wav" data-start="21.1" data-duration="0.9" data-track-index="5" data-volume="0.8"></audio>
    </div>
    <script>
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
